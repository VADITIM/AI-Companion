<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pino's World</title>
<style>
  /* Pino's style tokens. He changes these himself (see the Style tab). */
  :root { --cream:#fff4d6; --ink:#1a1040; --accent:#4b47d6; --soft:#c9c2ff; --pop:#ff8fd8; --sun:#ffd23f; --mint:#7ff0c6;
          --r:18px; --bw:2.5px; --sh:4px; --tilt:-1.2deg; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1a2a; font-family: ui-rounded, "Nunito", "Segoe UI", system-ui, sans-serif; color: var(--ink); font-size: 13px; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .card { background: var(--cream); border: var(--bw) solid var(--ink); border-radius: var(--r); box-shadow: var(--sh) var(--sh) 0 var(--ink); }
  .chip { border: 2px solid var(--ink); border-radius: 999px; background: var(--soft); padding: 3px 10px; font-weight: 800; }
  .chip:hover, .chip.on { background: var(--sun); }

  #pinoCard { position: fixed; top: 14px; left: 14px; width: 250px; padding: 12px; }
  #pinoCard header { display: flex; gap: 10px; align-items: center; }
  #ava { width: 46px; height: 46px; flex: none; border-radius: 50%; border: var(--bw) solid var(--ink); background: radial-gradient(circle at 35% 35%, var(--soft), var(--accent)); display: grid; place-items: center; font-size: 22px; transform: rotate(var(--tilt)); }
  #pinoCard h1 { margin: 0; font-size: 17px; font-weight: 900; }
  #statusText { margin: 2px 0 0; line-height: 1.25; min-height: 2.5em; }
  #drives { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin: 10px 0; }
  .drive { font-size: 11px; font-weight: 800; }
  .bar { height: 8px; border: 2px solid var(--ink); border-radius: 6px; background: #fff; margin-top: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; transition: width .4s; }
  #pinoCard footer { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #goal { font-size: 11px; opacity: .8; }

  #clock { position: fixed; top: 14px; right: 74px; padding: 7px 14px; font-weight: 900; font-size: 14px; transform: rotate(calc(var(--tilt) * -1)); }
  #rail { position: fixed; top: 14px; right: 14px; display: grid; gap: 6px; padding: 6px; }
  #rail button { width: 38px; height: 38px; border: 2px solid transparent; border-radius: calc(var(--r) * .6); background: none; font-size: 19px; }
  #rail button:hover { background: var(--soft); }
  #rail button.on { background: var(--accent); border-color: var(--ink); }
  #drawer { position: fixed; top: 62px; right: 74px; width: 320px; max-width: calc(100vw - 96px); max-height: calc(100vh - 150px); display: flex; flex-direction: column; overflow: hidden; }
  #drawer[hidden] { display: none; }
  #drawer > header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--accent); color: #fff; border-bottom: var(--bw) solid var(--ink); }
  #drawer h2 { margin: 0; font-size: 15px; }
  #drawer > header button { border: 0; background: none; color: #fff; font-size: 15px; }
  .tab { padding: 12px 14px; overflow-y: auto; display: grid; gap: 9px; }
  .tab[hidden] { display: none; }
  .tab h3 { margin: 6px 0 0; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .65; }
  .row { display: flex; gap: 8px; align-items: flex-start; line-height: 1.3; }
  .row > b:first-child { flex: none; width: 20px; text-align: center; }
  .row small { display: block; opacity: .7; }
  .tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag { border: 2px solid var(--ink); border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 800; background: #fff; }
  .note { font-size: 11px; opacity: .7; border-left: 3px solid var(--pop); padding-left: 8px; }
  .news { border: 2px solid var(--ink); border-radius: calc(var(--r) * .6); padding: 7px 9px; background: #fff; }
  .news.unread { opacity: .55; }
  .news q { display: block; margin-top: 4px; color: var(--accent); font-weight: 700; quotes: "“" "”"; }
  .sw { display: flex; gap: 4px; } .sw i { width: 24px; height: 24px; border: 2px solid var(--ink); border-radius: 6px; }
  #preview { padding: 10px; display: grid; gap: 8px; justify-items: start; }
  #preview button { background: var(--accent); color: #fff; border: var(--bw) solid var(--ink); border-radius: var(--r); box-shadow: var(--sh) var(--sh) 0 var(--ink); padding: 6px 14px; font-weight: 900; transform: rotate(var(--tilt)); }
  .tab label { display: grid; gap: 3px; font-weight: 800; }
  .tab label.chk { grid-template-columns: auto 1fr; align-items: center; gap: 8px; }
  .tab input[type=range], .tab select { width: 100%; accent-color: var(--accent); }
  .tab .v { font-weight: 400; opacity: .7; }
  .btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .btns button { border: 2px solid var(--ink); border-radius: 10px; padding: 5px 0; font-weight: 800; background: var(--soft); }
  .btns button:hover { background: var(--sun); }

  #hotbar { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; }
  .slot { position: relative; width: 46px; height: 46px; border: 2px solid var(--ink); border-radius: calc(var(--r) * .55); background: #fff; display: grid; place-items: center; font-size: 22px; }
  .slot.empty { opacity: .35; } .slot.tool { background: var(--mint); }
  .slot b { position: absolute; right: -6px; bottom: -6px; min-width: 18px; padding: 0 4px; border: 2px solid var(--ink); border-radius: 999px; background: var(--sun); font-size: 11px; text-align: center; }
  .slot.bump { animation: bump .3s; }
  @keyframes bump { 50% { transform: scale(1.25) rotate(-6deg); } }
  #hint { position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%); color: #fff; font-weight: 800; text-shadow: 0 2px 0 var(--ink); pointer-events: none; white-space: nowrap; opacity: .9; }

  #feed { position: fixed; left: 14px; bottom: 14px; width: 270px; display: flex; flex-direction: column-reverse; gap: 6px; pointer-events: none; }
  .toast { padding: 6px 10px; font-weight: 700; line-height: 1.25; border-radius: calc(var(--r) * .7); animation: pop .25s; }
  .toast.out { opacity: 0; transition: opacity .6s; }
  @keyframes pop { from { transform: translateX(-20px) scale(.9); opacity: 0; } }

  #tip { position: fixed; pointer-events: none; padding: 5px 10px; font-weight: 800; max-width: 240px; border-radius: calc(var(--r) * .6); z-index: 5; }
  #tip small { display: block; font-weight: 500; opacity: .75; }
  #menu { position: fixed; padding: 6px; display: grid; gap: 4px; min-width: 190px; z-index: 6; }
  #menu h4 { margin: 2px 6px 4px; font-size: 13px; }
  #menu button { display: flex; gap: 8px; align-items: center; text-align: left; border: 2px solid transparent; border-radius: calc(var(--r) * .5); background: none; padding: 5px 8px; font-weight: 800; }
  #menu button:hover:not(:disabled) { background: var(--soft); border-color: var(--ink); }
  #menu button:disabled { opacity: .5; cursor: not-allowed; }
  #menu small { font-weight: 500; opacity: .8; display: block; }
  #bubble { position: fixed; pointer-events: none; transform: translate(-50%, -100%); font-size: 20px; padding: 5px 10px; border-radius: 22px; }
  #code { position: fixed; left: 14px; top: 250px; width: 300px; margin: 0; padding: 10px 12px; font: 11px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap; background: var(--ink); color: var(--mint); border-color: var(--mint); max-height: 46vh; overflow: hidden; }
  .float { position: fixed; pointer-events: none; font-weight: 900; font-size: 16px; color: #fff; text-shadow: 0 2px 0 var(--ink), 0 0 6px var(--ink); animation: rise 1.3s ease-out forwards; z-index: 4; }
  @keyframes rise { to { transform: translateY(-60px); opacity: 0; } }
  [hidden] { display: none !important; }
  @media (max-width: 700px) {
    #pinoCard { width: 190px; padding: 8px; } #drives { grid-template-columns: 1fr; } #clock { top: auto; bottom: 76px; right: 14px; }
    #drawer { right: 14px; top: 250px; max-width: calc(100vw - 28px); } #feed, #hint { display: none; } #code { top: auto; bottom: 76px; }
  }
</style>
</head>
<body>
<section id="pinoCard" class="card">
  <header><div id="ava">🥝</div><div><h1>Pino <span id="mood">🙂</span></h1><p id="statusText">Pino is waking up</p></div></header>
  <div id="drives"></div>
  <footer><button id="follow" class="chip">🎥 Follow</button><span id="goal"></span></footer>
</section>
<div id="clock" class="card">☀️ 08:00 · Day 1</div>
<nav id="rail" class="card">
  <button data-tab="mind" title="Mind: what Pino knows">🧠</button>
  <button data-tab="journal" title="Journal">📓</button>
  <button data-tab="news" title="News channel">📰</button>
  <button data-tab="style" title="Pino's UI style">🎨</button>
  <button data-tab="world" title="World settings">⚙️</button>
</nav>
<aside id="drawer" class="card" hidden>
  <header><h2 id="dTitle"></h2><button id="dClose">✕</button></header>
  <div class="tab" id="tab-mind" hidden></div>
  <div class="tab" id="tab-journal" hidden></div>
  <div class="tab" id="tab-news" hidden></div>
  <div class="tab" id="tab-style" hidden></div>
  <div class="tab" id="tab-world" hidden>
    <label>Time of day <span class="v" id="vTod"></span><input id="tod" type="range" min="0" max="24" step="0.05" value="8"></label>
    <div class="btns"><button data-h="6">Dawn</button><button data-h="12">Noon</button><button data-h="17.6">Sunset</button><button data-h="0.5">Night</button></div>
    <label>Day length <select id="len"><option value="120">2 min</option><option value="300" selected>5 min</option><option value="900">15 min</option><option value="0">Paused</option></select></label>
    <h3>Things outside Pino's control</h3>
    <div class="btns"><button data-ev="rain">Rain</button><button data-ev="gust">Gust</button><button data-ev="balloon">Gift</button><button data-ev="star">Star</button></div>
    <h3>Look</h3>
    <label>Pixel size <span class="v" id="vPix"></span><input id="pix" type="range" min="1" max="6" step="1" value="2"></label>
    <label>Colour levels <span class="v" id="vLev"></span><input id="lev" type="range" min="4" max="64" step="1" value="20"></label>
    <label class="chk"><input id="dit" type="checkbox" checked> Ordered dither</label>
    <label>God rays <span class="v" id="vRay"></span><input id="ray" type="range" min="0" max="3" step="0.05" value="1"></label>
    <label>Glow <span class="v" id="vBlo"></span><input id="blo" type="range" min="0" max="2" step="0.05" value="1"></label>
    <label>Saturation <span class="v" id="vSat"></span><input id="sat" type="range" min="0.6" max="2" step="0.05" value="1.25"></label>
    <label>Wind <span class="v" id="vWin"></span><input id="win" type="range" min="0" max="2.5" step="0.05" value="1"></label>
  </div>
</aside>
<div id="hotbar" class="card"></div>
<div id="hint">Hover and click anything · drag to look around · scroll to zoom</div>
<div id="feed"></div>
<div id="tip" class="card" hidden></div>
<div id="menu" class="card" hidden></div>
<div id="bubble" class="card">🌱</div>
<pre id="code" class="card" hidden></pre>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const MOBILE = matchMedia('(pointer: coarse)').matches || innerWidth < 700;
const WATER_Y = -0.45;

// ---------------------------------------------------------------- helpers
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = x => Math.min(1, Math.max(0, x));
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
function hash2(x, y, s) { const h = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453; return h - Math.floor(h); }
function vnoise(x, y, s = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s = 0, o = 4) { let f = 0, amp = 0.5, fr = 1; for (let i = 0; i < o; i++) { f += amp * vnoise(x * fr, y * fr, s + i * 17); amp *= 0.5; fr *= 2; } return f / (1 - Math.pow(0.5, o)); }
function distSeg(px, pz, ax, az, bx, bz) { const vx = bx - ax, vz = bz - az; const t = clamp01(((px - ax) * vx + (pz - az) * vz) / (vx * vx + vz * vz)); return Math.hypot(px - ax - vx * t, pz - az - vz * t); }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const C = hex => new THREE.Color(hex);

const GLSL_NOISE = `
float hash21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3. - 2. * f);
  return mix(mix(hash21(i), hash21(i + vec2(1., 0.)), u.x), mix(hash21(i + vec2(0., 1.)), hash21(i + vec2(1., 1.)), u.x), u.y); }
float fbm(vec2 p){ float f = 0., a = .5; for (int i = 0; i < 5; i++) { f += a * vnoise(p); p *= 2.03; a *= .5; } return f / .97; }
`;

// shared uniforms, updated once per frame
const U = {
  uTime: { value: 0 }, uWind: { value: 1 }, uNight: { value: 0 },
  uSun: { value: new THREE.Color() }, uAmb: { value: new THREE.Color() }, uLight: { value: new THREE.Color(1, 1, 1) },
};
function shaderMat({ uniforms = {}, shared = [], ...rest }) {
  const m = new THREE.ShaderMaterial({ fog: true, uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, uniforms]), ...rest });
  for (const k of shared) m.uniforms[k] = U[k];
  return m;
}

// ---------------------------------------------------------------- renderer, scene, camera
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xc4ecff, 0.01);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(44, 30, 46);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0); controls.enableDamping = true;
controls.autoRotate = false;
controls.minDistance = 6; controls.maxDistance = 170; controls.maxPolarAngle = Math.PI * 0.8;

const hemi = new THREE.HemisphereLight(0xbfe6ff, 0x4f7a3a, 1.5);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 3);
key.castShadow = true;
key.shadow.mapSize.set(MOBILE ? 1024 : 2048, MOBILE ? 1024 : 2048);
Object.assign(key.shadow.camera, { left: -46, right: 46, top: 46, bottom: -46, near: 1, far: 220 });
key.shadow.bias = -0.0005; key.shadow.normalBias = 0.04;
scene.add(key, key.target);

// ---------------------------------------------------------------- sky (gradient, clouds, cloud sea, sun, moon, stars, aurora)
const SKY = {
  uTop: { value: new THREE.Color() }, uHor: { value: new THREE.Color() }, uVoid: { value: new THREE.Color() },
  uCloud: { value: new THREE.Color() }, uSunCol: { value: new THREE.Color() },
  uSunDir: { value: new THREE.Vector3() }, uMoonDir: { value: new THREE.Vector3() },
  uStars: { value: 0 }, uAurora: { value: 0 }, uTime: U.uTime,
};
const sky = new THREE.Mesh(new THREE.SphereGeometry(400, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, depthTest: false, uniforms: SKY,
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `
    uniform vec3 uTop, uHor, uVoid, uCloud, uSunCol, uSunDir, uMoonDir; uniform float uStars, uAurora, uTime;
    varying vec3 vDir;
    ${GLSL_NOISE}
    float hash31(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
    void main(){
      vec3 d = normalize(vDir); float h = d.y;
      vec3 col = h >= 0. ? mix(uHor, uTop, pow(clamp(h, 0., 1.), .55)) : mix(uHor, uVoid, smoothstep(0., .3, -h));
      if (h > 0.) {
        vec2 uv = d.xz / (h + .12) * .9 + vec2(uTime * .004, uTime * .002);
        float c = smoothstep(.5, .8, fbm(uv * 1.2));
        col = mix(col, uCloud, c * .85 * smoothstep(0., .25, h));
      } else {
        vec2 uv = d.xz / (-h + .06) * .6 + vec2(uTime * .003, 0.);
        col = mix(col, uCloud, smoothstep(.35, .85, fbm(uv)) * .6 * smoothstep(0., .15, -h));
      }
      float sd = max(dot(d, uSunDir), 0.);
      col += uSunCol * (pow(sd, 1500.) * 30. + pow(sd, 40.) * .6 + pow(sd, 6.) * .25);
      float md = max(dot(d, uMoonDir), 0.);
      col += vec3(.75, .85, 1.) * (smoothstep(.9995, .9997, md) * 3. + pow(md, 60.) * .15) * uStars;
      float s = hash31(floor(d * 220.));
      col += step(.997, s) * uStars * smoothstep(-.05, .25, h) * (.6 + .4 * sin(uTime * 2. + s * 500.)) * 1.5;
      if (uAurora > .01 && h > 0.) {
        vec2 uv = d.xz / (h + .25); float t = uTime * .05;
        float n = fbm(vec2(uv.x * .6 + t, uv.y * .6 - t * .5));
        float y = uv.y + (n - .5) * 1.6;
        float band = exp(-pow((y - .4) * 2.2, 2.)) + .6 * exp(-pow((y + .6) * 2.8, 2.));
        float streak = .55 + .45 * vnoise(vec2(uv.x * 9. + n * 3., t * 4.));
        vec3 aur = mix(vec3(.1, 1., .45), vec3(.35, .3, 1.), smoothstep(.2, .9, h + n * .3));
        col += aur * band * streak * smoothstep(.05, .45, h) * uAurora * 1.2;
      }
      gl_FragColor = vec4(col, 1.);
    }`,
}));
sky.renderOrder = -1; sky.frustumCulled = false;
scene.add(sky);

// ---------------------------------------------------------------- materials
const GRASS_DARK = C('#3f8a2a'), GRASS_LIGHT = C('#8cc63f'), GRASS_TIP = C('#d2ec6e'), SAND = C('#d9c08a');
const tintAt = (x, z) => 0.5 + 0.5 * Math.sin(x * 0.21 + 1.3) * Math.sin(z * 0.17 + 0.4);

const grassMat = shaderMat({
  shared: ['uTime', 'uWind', 'uSun', 'uAmb'], side: THREE.DoubleSide,
  uniforms: { uDark: { value: GRASS_DARK }, uLightG: { value: GRASS_LIGHT }, uTip: { value: GRASS_TIP } },
  vertexShader: `
    uniform float uTime, uWind;
    varying float vH; varying float vTint;
    #include <fog_pars_vertex>
    void main(){
      vec4 base = modelMatrix * instanceMatrix * vec4(0., 0., 0., 1.);
      vec4 world = modelMatrix * instanceMatrix * vec4(position, 1.);
      float h = uv.y;
      float w = sin(uTime * 1.6 + base.x * .35 + base.z * .22) * .6 + sin(uTime * 3.3 + base.x * 1.7 + base.z * .9) * .2;
      world.x += w * uWind * .2 * h * h;
      world.z += w * uWind * .1 * h * h;
      vH = h;
      vTint = .5 + .5 * sin(base.x * .21 + 1.3) * sin(base.z * .17 + .4);
      vec4 mvPosition = viewMatrix * world;
      gl_Position = projectionMatrix * mvPosition;
      #include <fog_vertex>
    }`,
  fragmentShader: `
    uniform vec3 uSun, uAmb, uDark, uLightG, uTip;
    varying float vH; varying float vTint;
    #include <fog_pars_fragment>
    void main(){
      vec3 albedo = mix(mix(uDark, uLightG, vTint), uTip, vH * vH);
      vec3 col = albedo * (uSun * (.55 + .45 * vH) + uAmb) * .3183;
      col *= mix(.45, 1., vH);
      gl_FragColor = vec4(col, 1.);
      #include <fog_fragment>
    }`,
});

function swayTrees(mat) {
  mat.onBeforeCompile = s => {
    s.uniforms.uTime = U.uTime; s.uniforms.uWind = U.uWind;
    s.vertexShader = 'uniform float uTime; uniform float uWind;\n' + s.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      float ph = modelMatrix[3].x * .3 + modelMatrix[3].z * .2;
      float k = max(position.y, 0.) * .15;
      transformed.x += sin(uTime * 1.2 + ph) * .12 * k * k * uWind;
      transformed.z += cos(uTime * .9 + ph) * .08 * k * k * uWind;`);
  };
  return mat;
}
const terrainMat = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
const rockMat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true, side: THREE.DoubleSide });
const treeMat = swayTrees(new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }));
const bushMat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
const flowerMats = [];

const waterMat = shaderMat({
  shared: ['uTime', 'uNight', 'uLight'], transparent: true, depthWrite: false, side: THREE.DoubleSide,
  vertexShader: `
    attribute float aDepth; varying float vDepth; varying vec3 vW;
    #include <fog_pars_vertex>
    void main(){
      vDepth = aDepth;
      vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz;
      vec4 mvPosition = viewMatrix * w;
      gl_Position = projectionMatrix * mvPosition;

function vertexColorsFor(geo, fn) {

}
function cypressGeo(H, Rw, s) {
  const pts = [];

    pos.setX(i, pos.getX(i) * j); pos.setZ(i, pos.getZ(i) * j);

  vertexColorsFor(g, (c, x, y) => c.lerpColors(lo, hi, Math.pow(y / H, 0.8)));
  g.computeVertexNormals();

}

}
const bladeGeo = (() => {
  const w = 0.09, lv = [[0, 1], [0.4, 0.75], [0.75, 0.4]], pos = [], uv = [], idx = [];
  lv.forEach(([y, k]) => { pos.push(-w * k / 2, y, 0.15 * y * y, w * k / 2, y, 0.15 * y * y); uv.push(0, y, 1, y); });
  pos.push(0, 1, 0.15); uv.push(0.5, 1);

function ribbon(rows) {

function makeIsland(o) {
  const { R, depth, seed, hills = 1, x: ox = 0, y: oy = 0, z: oz = 0, pond = null, mound = null, trees = 10, treeBias = null } = o;
  const r = rng(seed * 991 + 7);

  }

    let h = 0.5 + hills * (fbm(x * 0.08 + seed, z * 0.08 - seed, seed) - 0.45) * 2.0 * (1 - rn ** 3) - 0.5 * rn ** 8;
    if (mound) h += mound.h * Math.exp(-((x - mound.x) ** 2 + (z - mound.z) ** 2) / (mound.r ** 2)) * (1 - rn ** 4);

    }

// what you asked him to do; he can say no, and says why
function answer(q) {
  const no = (icon, why) => { toast(`🥝 “${why}”`); return [act(2.2, icon, 'Pino: ' + why, 'think')]; };
  if (q.verb === 'walk') {
    if (rnOf(q.x, q.z) > 0.93) return no('⚠️', know['edge:peek'] ? 'Not there. That is the edge and it does not end.' : 'That looks too close to the edge.');
    if (main.isWater(q.x, q.z, 0.2)) return no('⚠️', 'That is in the water. I cannot swim.');
    return [go([q.x, q.z], 0.3, '🐾', 'Pino walks to where you pointed'), act(1.2, '🙂', 'Pino looks around', 'hop')];
  }
  if (q.verb === 'chop') return tools.axe ? chopPlan(q.ent) : know['tree:chop'] ? no('🔒', 'I cannot chop with a beak. I need a tool first.') : EXPERIMENTS[0].plan();
  if (q.verb === 'drink') return D.water > 0.9 ? no('💧', 'I am not thirsty right now.') : drinkPlan();

    const tgt = Array.isArray(s.to) ? s.to : s.to.alive ? [s.to.x, s.to.z] : null;
    if (!tgt || (pn.walkT += dt) > 45) { pn.plan = []; pn.step = null; say('🤔', 'Pino changed his mind'); return; }
    if (walk(dt, tgt[0], tgt[1], t) <= s.r) pn.arrived = true;
  } else if (pn.t > 0) {
    pn.t -= dt; const p = kiwi.position, g = ground(p.x, p.z);
    if (s.face) turnTo(Math.atan2(-(s.face[1] - p.z), s.face[0] - p.x), Math.min(1, dt * 8));
    kiwi.rotation.z = s.anim === 'peck' ? -Math.abs(Math.sin(t * 7)) * 0.4 : s.anim === 'shiver' ? Math.sin(t * 40) * 0.06 : s.anim === 'think' ? Math.sin(t * 2) * 0.05 : 0;
    p.y = g + (s.anim === 'hop' ? Math.abs(Math.sin(t * 8)) * 0.35 : 0);
    if (s.code) { $('code').hidden = false; $('code').textContent = s.code.slice(0, Math.floor(s.code.length * Math.min(1, (1 - pn.t / s.dur) * 1.25))) + '▌'; }
  } else { kiwi.rotation.z = 0; if (s.code) setTimeout(() => { $('code').hidden = true; }, 2500); s.on?.(); pn.step = null; }
}

// ================================================================ MAIN LOOP
const sunDir = new THREE.Vector3(), moonDir = new THREE.Vector3(), tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();
const clock = new THREE.Clock();
let frame = 0, rainK = 0;
kiwi.position.set(door.x, ground(door.x, door.z), door.z);
log('🌱', 'Day 1. I live on an island. I do not know yet what I can do here.');
let simT = 0;
function tick(simDt) {   // simDt set = advance the simulation without drawing (used by world.skip for testing)
  const dt = simDt || Math.min(clock.getDelta(), 0.1), t = (simT += dt); frame++;
  U.uTime.value = t;
  if (dayLength > 0) tod = (tod + dt / dayLength) % 1;

  // weather and random events
  rain = Math.max(0, rain - dt); gust = Math.max(0, gust - dt);
  rainK = lerp(rainK, rain > 0 ? 1 : 0, Math.min(1, dt * 0.8)); rainMat.uniforms.uRain.value = rainK;
  U.uWind.value = +$('win').value * (1 + 1.8 * smooth(0, 2, gust) + 0.6 * rainK);
  if ((nextEvent -= dt) <= 0) { nextEvent = 40 + Math.random() * 50; worldEvent(isNight() ? (Math.random() < 0.6 ? 'star' : 'gust') : ['rain', 'gust', 'balloon', 'balloon'][Math.floor(Math.random() * 4)]); }

  // sky, lights, fog from keyframes
  sampleKeys(tod);
  const a = (tod - 0.25) * Math.PI * 2;
  sunDir.set(Math.cos(a), Math.sin(a), 0.35).normalize(); moonDir.copy(sunDir).negate();
  const keyDir = sunDir.y > -0.03 ? sunDir : moonDir;
  const keyI = cur.sunI * smooth(-0.02, 0.12, keyDir.y) * (1 - 0.45 * rainK);
  key.color.copy(cur.sun); key.intensity = keyI;
  key.target.position.copy(controls.target); key.position.copy(controls.target).addScaledVector(keyDir, 80);
  hemi.color.copy(cur.hs); hemi.groundColor.copy(cur.hg); hemi.intensity = cur.hI;
  scene.fog.color.copy(cur.fog); scene.fog.density = cur.fogD * (0.6 + 0.5 * rainK);
  SKY.uTop.value.copy(cur.top).lerp(cur.fog, rainK * 0.6); SKY.uHor.value.copy(cur.hor); SKY.uVoid.value.copy(cur.void); SKY.uCloud.value.copy(cur.cloud);
  SKY.uSunCol.value.copy(cur.sun).multiplyScalar(1.2 * smooth(-0.08, 0.04, sunDir.y) * (1 - rainK));
  SKY.uSunDir.value.copy(sunDir); SKY.uMoonDir.value.copy(moonDir); SKY.uStars.value = cur.stars; SKY.uAurora.value = cur.aurora;
  U.uSun.value.copy(cur.sun).multiplyScalar(keyI * Math.max(keyDir.y, 0));
  U.uAmb.value.copy(cur.hs).multiplyScalar(cur.hI);
  U.uLight.value.copy(U.uSun.value).add(U.uAmb.value).multiplyScalar(1 / Math.PI);
  const night = 1 - smooth(-0.1, 0.15, sunDir.y); U.uNight.value = night;
  const lum = Math.min(1, 0.05 + U.uLight.value.r * 0.3 + U.uLight.value.g * 0.6);
  flowerMats.forEach(m => m.color.setScalar(lum));
  DIM.forEach(d => d.m.color.copy(d.base).multiplyScalar(lum));
  GLOWS.forEach(m => m.color.copy(m.userData.base).multiplyScalar(0.25 + night * 4));
  cloudMat.color.copy(cur.fog).multiplyScalar(1.15);
  clouds.forEach(c => { c.position.x += c.userData.v * dt; if (c.position.x > 120) c.position.x = -120; });
  satellites.forEach(s => { s.group.position.y = s.baseY + Math.sin(t * 0.25 + s.phase) * 0.8; });
  sky.position.copy(camera.position);

  // the world keeps going on its own
  for (const e of ents) {
    if (!e.alive) continue;
    if (e.kind === 'stump' && (e.regrow -= dt) <= 0) { kill(e); const n = addTree(e.x, e.z, 0.15); tween(30, k => n.obj.scale.setScalar(0.15 + 0.85 * k)); }
    else if (e.kind === 'bush' && e.berries < 3 && (e.rip -= dt * (rain > 0 ? 3 : 1)) <= 0) { e.berries++; e.rip = 25; setBerries(e); }
    else if (e.kind === 'campfire') { const f = 0.85 + 0.15 * Math.sin(t * 13 + e.x) + 0.1 * Math.sin(t * 29); e.flame.scale.set(0.26 * f, 0.7 * f, 0.26 * f); e.light.intensity = (0.2 + night) * 45 * f; }
  }
  butterflies.forEach(b => {
    const p = b.g.position; b.g.visible = night < 0.5 && rainK < 0.5;
    let dx = b.tx - p.x, dz = b.tz - p.z; const d = Math.hypot(dx, dz);
    if (d < 0.4) { const f = ents[Math.floor(Math.random() * ents.length)]; if (f.alive && f.kind === 'flower') { b.tx = f.x; b.tz = f.z; } else [b.tx, b.tz] = main.randomPoint(0.05, 0.85); }
    else { p.x += dx / d * 1.6 * dt + Math.sin(t * 3 + b.ph) * dt; p.z += dz / d * 1.6 * dt + Math.cos(t * 2.3 + b.ph) * dt; b.g.rotation.y = Math.atan2(-dz, dx); }
    p.y = ground(p.x, p.z) + 0.9 + Math.sin(t * 2 + b.ph) * 0.3;
    const fl = Math.sin(t * 16 + b.ph) * 0.9; b.g.userData.wings[0].rotation.z = fl; b.g.userData.wings[1].rotation.z = -fl;
  });
  birds.forEach(b => {
    const an = t * b.sp + b.ph; b.g.visible = night < 0.6;
    b.g.position.set(Math.cos(an) * b.rad, b.h + Math.sin(t * 0.5 + b.ph) * 1.5, Math.sin(an) * b.rad); b.g.rotation.y = -an - Math.PI / 2;
    const fl = Math.sin(t * 6 + b.ph) * 0.6; b.g.userData.wings[0].rotation.z = fl; b.g.userData.wings[1].rotation.z = -fl;
  });
  if (bal) {
    bal.t += dt; const k = bal.t / 50, x0 = Math.cos(bal.a) * 30, z0 = Math.sin(bal.a) * 30, x = lerp(x0, -x0 * 0.8, k), z = lerp(z0, -z0 * 0.8, k);
    balloon.position.set(x, Math.max(ground(x, z), 0) + 3 + Math.sin(t * 1.2) * 0.5, z); balloon.rotation.z = Math.sin(t * 0.9) * 0.08;
    if (k >= 1) { bal = null; BALLOON_ENT.alive = false; balloon.visible = false; }
  }
  if (starT > 0) { starT -= dt; const k = 1 - starT / 1.4; star.position.copy(camera.position).add(tmp.set(-140 + 260 * k, 150 - 70 * k, -160)); if (starT <= 0) star.visible = false; }
  stepTweens(dt); stepParticles(dt); stepPino(dt, t);
  if (simDt) return;

  // camera
  if (follow) { tmp.copy(kiwi.position); main.group.localToWorld(tmp); tmp2.copy(tmp).sub(controls.target).multiplyScalar(Math.min(1, dt * 3)); controls.target.add(tmp2); camera.position.add(tmp2); }
  controls.update();

  // mouse: what is under the pointer
  if (needPick || (hover && frame % 20 === 0)) pick();
  if (hover && ringMesh.visible) { const s = hover.r * 1.25 * (1 + 0.06 * Math.sin(t * 6)); ringMesh.scale.setScalar(s); ringMesh.position.set(hover.x, ground(hover.x, hover.z) + 0.12, hover.z); }

  // god rays + post
  tmp.copy(camera.position).addScaledVector(sunDir, 100).project(camera);
  const onScreen = tmp.z < 1 ? smooth(1.6, 1.0, Math.max(Math.abs(tmp.x), Math.abs(tmp.y))) : 0;
  post.uniforms.sunUV.value.set((tmp.x + 1) / 2, (tmp.y + 1) / 2);
  post.uniforms.sunVis.value = onScreen * smooth(-0.05, 0.05, sunDir.y) * (1 - rainK);
  post.uniforms.rays.value = cur.rays * +$('ray').value;
  post.uniforms.rayColor.value.copy(cur.sun);
  post.uniforms.exposure.value = cur.exp * (1 - 0.15 * rainK);
  const tn = tmp2.set(cur.tint.r, cur.tint.g, cur.tint.b); post.uniforms.tint.value.set(Math.pow(tn.x, 1 / 2.2), Math.pow(tn.y, 1 / 2.2), Math.pow(tn.z, 1 / 2.2));
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);

  // HUD
  const bp = pn.asleep ? [hutPos.x, ground(hutPos.x, hutPos.z) + 5, hutPos.z] : [kiwi.position.x, kiwi.position.y + 2.3, kiwi.position.z];
  const [bx, by, bok] = toScreen(...bp), B = $('bubble');
  B.style.display = bok ? 'block' : 'none'; B.style.left = (bx + 26) + 'px'; B.style.top = by + 'px';
  if (frame % 12 === 0) {
    B.textContent = rainK > 0.5 && !pn.asleep ? pn.icon + '☔' : pn.icon; $('statusText').textContent = pn.text; $('mood').textContent = moodIcon();
    DRIVES.forEach(([k]) => { $('d-' + k).style.width = Math.round(D[k] * 100) + '%'; });
    const ct = clockText(tod); $('clock').textContent = `${ct.icon} ${ct.time} · Day ${day}${rain > 0 ? ' · 🌧️' : ''}`;
    if (dayLength > 0 && openTab === 'world') { $('tod').value = (tod * 24).toFixed(2); sync(); }
    if (frame % 120 === 0) renderTab('mind');
  }
}
renderer.setAnimationLoop(() => tick());
window.world = { skip: s => { for (let i = 0; i < s * 10; i++) tick(0.1); }, journal, fires, camera, controls, setTime: h => { tod = h / 24; }, main, kiwi, pn, D, inv, tools, know, ents, worldEvent, requests, decide, INVENT, learn };
</script>
