<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honk's island</title>
<style>
  :root { --bg:#f4f1ea; --panel:#fbfaf6; --ink:#23211c; --dim:#7a7568; --line:#e2ddd0; --bar:#d9d3c3;
          --accent:#2f7d6b; --warm:#c8642a; --model:#6a4bc4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15171a; --panel:#1c1f23; --ink:#e8e6df; --dim:#8d8a80; --line:#2c3036; --bar:#32363d;
            --accent:#5ec4ab; --warm:#f0935a; --model:#a892f5; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
               font:13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display:grid; grid-template-columns: 1fr 400px; height:100%; }
  #stage { position:relative; overflow:hidden; min-height:300px; }
  #stage canvas { display:block; width:100%; height:100%; }
  #hud { position:absolute; left:12px; top:12px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  #clock { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px 10px;
           font-variant-numeric: tabular-nums; }
  button { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:6px;
           padding:5px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  #bubble { position:absolute; max-width:260px; transform:translate(-50%,-100%); background:var(--panel);
            border:1px solid var(--line); border-radius:10px; padding:6px 10px; pointer-events:none;
            box-shadow:0 2px 10px rgba(0,0,0,.18); }
  #bubble.model { border-color:var(--model); }
  #side { overflow-y:auto; background:var(--panel); border-left:1px solid var(--line); padding:14px 16px 40px; }
  h1 { font-size:17px; margin:0 0 2px; }
  h2 { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:18px 0 6px;
       border-top:1px solid var(--line); padding-top:12px; }
  .sub { color:var(--dim); }
  .thought { font-size:15px; margin:8px 0 4px; }
  .row { display:grid; grid-template-columns: 86px 1fr 36px; gap:8px; align-items:center; margin:3px 0; }
  .track { height:7px; background:var(--bar); border-radius:4px; overflow:hidden; }
  .fill { height:100%; background:var(--accent); border-radius:4px; transition:width .4s; }
  .fill.hot { background:var(--warm); }
  .num { text-align:right; font-variant-numeric:tabular-nums; color:var(--dim); }
  ul { list-style:none; margin:0; padding:0; }
  li { margin:4px 0; }
  .tag { display:inline-block; font-size:10px; padding:0 5px; border-radius:8px; border:1px solid var(--line);
         color:var(--dim); margin-left:4px; vertical-align:1px; }
  .tag.model { color:var(--model); border-color:var(--model); }
  .tag.done { color:var(--accent); border-color:var(--accent); }
  .t { color:var(--dim); font-variant-numeric:tabular-nums; margin-right:6px; }
  .indent { margin-left:14px; }
  .mono { font:11px/1.4 ui-monospace, Menlo, Consolas, monospace; color:var(--dim); word-break:break-all; }
  @media (max-width: 820px) { #app { grid-template-columns:1fr; grid-template-rows:55vh auto; height:auto; }
                              #side { border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="hud">
      <span id="clock">…</span>
      <button data-speed="1">1×</button><button data-speed="4">4×</button><button data-speed="16">16×</button>
      <button id="pause">Pause</button>
      <button id="pet">Stroke him</button>
      <button id="drop">Drop something new</button>
    </div>
    <div id="bubble" hidden></div>
  </div>
  <div id="side">
    <h1 id="name">…</h1>
    <div class="sub" id="status"></div>
    <div class="thought" id="thought"></div>
    <div class="sub" id="intention"></div>
    <h2>Emotions</h2><div id="emotions"></div>
    <h2>Needs</h2><div id="needs"></div>
    <h2>Goals</h2><ul id="goals"></ul>
    <h2>Recent internal events</h2><ul id="monologue"></ul>
    <h2>Decisions</h2><ul id="decisions"></ul>
    <h2>Memories used in the last model call</h2><ul id="retrieved"></ul>
    <h2>What he knows</h2><ul id="known"></ul>
    <h2>Personality and learned preferences</h2><div id="traits"></div><ul id="prefs"></ul>
    <h2>Remembered days</h2><ul id="days"></ul>
    <h2>Measures</h2><div id="metrics" class="mono"></div>
    <h2>Protocol (last messages)</h2><div id="messages" class="mono"></div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const stage = $('stage');
const HALF = 20;

// ---------------------------------------------------------------- scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 400);
camera.position.set(0, 34, 40);
const controls = new OrbitControls(camera, renderer.domElement);
controls.maxPolarAngle = Math.PI / 2.15; controls.minDistance = 8; controls.maxDistance = 90; controls.target.set(0, 0, 0);
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(18, 30, 12); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, far: 120 });
const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x6b7a4a, 1.0);
scene.add(sun, hemi);
const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.9, ...extra });
const mesh = (geo, material, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, material); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; return m; };

const sea = mesh(new THREE.CircleGeometry(160, 48), mat(0x3f7fa6, { roughness: 0.4 }), 0, -0.6, 0); sea.rotation.x = -Math.PI / 2; sea.castShadow = false;
const land = mesh(new THREE.CylinderGeometry(HALF * 1.45, HALF * 1.55, 1, 40), mat(0x7fa35a), 0, -0.5, 0);
scene.add(sea, land);
for (let i = 0; i < 70; i++) {            // tufts, so the ground is not a flat plate
  const a = Math.random() * 6.283, r = Math.sqrt(Math.random()) * HALF * 1.35;
  scene.add(mesh(new THREE.ConeGeometry(0.18, 0.5, 4), mat(0x6a9148), Math.cos(a) * r, 0.25, Math.sin(a) * r));
}

const builders = {
  tree(o) { const g = new THREE.Group();
    g.add(mesh(new THREE.CylinderGeometry(0.28, 0.4, 2.6, 7), mat(0x7a5a3a), 0, 1.3, 0));
    g.add(mesh(new THREE.IcosahedronGeometry(1.7, 0), mat(0x4f8a3c), 0, 3.4, 0));
    g.userData.fruit = [...Array(5)].map((_, i) => { const a = i * 1.257; const f = mesh(new THREE.SphereGeometry(0.2, 8, 6), mat(0xd23b2e), Math.cos(a) * 1.45, 3.1 + (i % 2) * 0.6, Math.sin(a) * 1.45); g.add(f); return f; });
    return g; },
  bush(o) { const g = new THREE.Group();
    g.add(mesh(new THREE.IcosahedronGeometry(0.9, 0), mat(0x3f7a45), 0, 0.6, 0));
    g.userData.fruit = [...Array(6)].map((_, i) => { const a = i * 1.047; const f = mesh(new THREE.SphereGeometry(0.11, 6, 5), mat(0x3a2a6a), Math.cos(a) * 0.8, 0.7 + (i % 3) * 0.2, Math.sin(a) * 0.8); g.add(f); return f; });
    return g; },
  pond(o) { const g = new THREE.Group(); const w = mesh(new THREE.CylinderGeometry(3.2, 3.2, 0.12, 28), mat(0x4aa3c9, { roughness: 0.2 }), 0, 0.03, 0); w.castShadow = false; g.add(w);
    for (let i = 0; i < 9; i++) g.add(mesh(new THREE.DodecahedronGeometry(0.35, 0), mat(0x9a968c), Math.cos(i * 0.7) * 3.3, 0.15, Math.sin(i * 0.7) * 3.3)); return g; },
  nest(o) { const g = new THREE.Group(); const t = mesh(new THREE.TorusGeometry(0.9, 0.32, 6, 14), mat(0xb89a5e), 0, 0.3, 0); t.rotation.x = Math.PI / 2; g.add(t);
    g.add(mesh(new THREE.CylinderGeometry(0.85, 0.85, 0.15, 14), mat(0xd8c48c), 0, 0.1, 0)); return g; },
  ball(o) { const g = new THREE.Group(); g.add(mesh(new THREE.SphereGeometry(0.45, 14, 10), mat(0xe8563f), 0, 0.45, 0)); return g; },
  sand(o) { const g = new THREE.Group(); const s = mesh(new THREE.CylinderGeometry(2.2, 2.2, 0.06, 20), mat(0xe6d6a4), 0, 0.03, 0); s.castShadow = false; g.add(s); g.userData.marks = []; return g; },
  log(o) { const g = new THREE.Group(); const l = mesh(new THREE.CylinderGeometry(0.4, 0.45, 2.6, 8), mat(0x6e553a), 0, 0.42, 0); l.rotation.z = Math.PI / 2; g.add(l); return g; },
  mystery(o) { const g = new THREE.Group(); const c = new THREE.Color(o.color || '#ffffff');
    const m = mesh(new THREE.IcosahedronGeometry(0.42, 0), mat(c, { emissive: c, emissiveIntensity: 0.7 }), 0, 0.55, 0); g.add(m); g.userData.spin = m;
    const l = new THREE.PointLight(c, 3, 6); l.position.y = 0.8; g.add(l); return g; },
};
const things = new Map();

// the creature: a small goose
const honk = new THREE.Group();
const white = mat(0xf5f2ea), orange = mat(0xf09a2a), dark = mat(0x1c1c1c);
const body = mesh(new THREE.SphereGeometry(0.55, 12, 9), white, 0, 0.62, 0); body.scale.set(0.85, 0.8, 1.2);
const neck = mesh(new THREE.CylinderGeometry(0.13, 0.17, 0.7, 7), white, 0, 1.15, 0.42);
const head = mesh(new THREE.SphereGeometry(0.24, 10, 8), white, 0, 1.55, 0.47);
const beak = mesh(new THREE.ConeGeometry(0.1, 0.3, 6), orange, 0, 1.52, 0.75); beak.rotation.x = Math.PI / 2;
const eyeL = mesh(new THREE.SphereGeometry(0.04, 6, 5), dark, 0.13, 1.62, 0.63), eyeR = mesh(new THREE.SphereGeometry(0.04, 6, 5), dark, -0.13, 1.62, 0.63);
const footL = mesh(new THREE.BoxGeometry(0.16, 0.06, 0.28), orange, 0.18, 0.03, 0.05), footR = mesh(new THREE.BoxGeometry(0.16, 0.06, 0.28), orange, -0.18, 0.03, 0.05);
const upper = new THREE.Group(); upper.add(neck, head, beak, eyeL, eyeR);
honk.add(body, upper, footL, footR); scene.add(honk);

const RAIN = 900, rainGeo = new THREE.BufferGeometry(), rainPos = new Float32Array(RAIN * 3);
for (let i = 0; i < RAIN; i++) { rainPos[i * 3] = (Math.random() - 0.5) * 70; rainPos[i * 3 + 1] = Math.random() * 30; rainPos[i * 3 + 2] = (Math.random() - 0.5) * 70; }
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rain = new THREE.Points(rainGeo, new THREE.PointsMaterial({ color: 0xbfd8ee, size: 0.14, transparent: true, opacity: 0.7 }));
rain.visible = false; scene.add(rain);

function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// ---------------------------------------------------------------- state from the server
let lastThought = "", thoughtAt = 0;
let snap = null, target = new THREE.Vector3(-10.5, 0, -10.5), heading = 0, flash = 0;
const post = body => fetch('/api/input', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(poll);
async function poll() {
  try { snap = await (await fetch('/api/snapshot')).json(); syncWorld(snap.world); renderPanel(snap); }
  catch (e) { $('status').textContent = 'The server is not answering.'; }
}
setInterval(poll, 300); poll();
setInterval(() => fetch('/api/input', { method: 'POST', body: JSON.stringify({ type: 'presence' }) }).catch(() => {}), 2000);
async function days() {
  try { const d = await (await fetch('/api/memories')).json(); list('days', d.summaries, s => [el('span', 't', 'day ' + s.day), el('span', '', s.summary + ' ' + s.lesson), tag(s.source)], 'No day has ended yet.'); } catch (e) {}
}
setInterval(days, 5000); days();
document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => post({ type: 'speed', value: +b.dataset.speed }));
$('pause').onclick = () => post({ type: 'pause' });
$('pet').onclick = () => { flash = 1; post({ type: 'pet' }); };
$('drop').onclick = () => post({ type: 'drop' });

function syncWorld(w) {
  const seen = new Set();
  for (const o of w.objects) {
    seen.add(o.id);
    let g = things.get(o.id);
    if (!g) { g = (builders[o.model] || builders.mystery)(o); things.set(o.id, g); scene.add(g); g.position.set(o.pos[0] - HALF, 0, o.pos[1] - HALF); }
    g.userData.goal = new THREE.Vector3(o.pos[0] - HALF, 0, o.pos[1] - HALF);
    if (g.userData.fruit) g.userData.fruit.forEach((f, i) => f.visible = i < (o.stock ?? 0));
    if (g.userData.marks) while (g.userData.marks.length < Math.min(o.works || 0, 14)) {     // one mark in the sand per thing he made
      const a = Math.random() * 6.283, r = Math.random() * 1.7, m = mesh(new THREE.TorusGeometry(0.12 + Math.random() * 0.14, 0.025, 4, 10), mat(0xa88e5a), Math.cos(a) * r, 0.07, Math.sin(a) * r);
      m.rotation.x = Math.PI / 2; m.castShadow = false; g.add(m); g.userData.marks.push(m);
    }
  }
  for (const [id, g] of things) if (!seen.has(id)) { scene.remove(g); things.delete(id); }
  target.set(w.creature.pos[0] - HALF, 0, w.creature.pos[1] - HALF);
  heading = w.creature.heading;
  rain.visible = w.weather !== 'clear';
}

// ---------------------------------------------------------------- panel
const pct = v => Math.round(v * 100) + '%';
const hhmm = m => { const d = Math.floor(m / 1440), t = Math.floor(m % 1440); return `day ${d}, ${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; };
const tag = (text, cls) => el('span', 'tag ' + (cls || (text === 'model' ? 'model' : '')), text);
function bars(id, values, hotAbove) {
  const box = $(id); box.replaceChildren();
  for (const [k, v] of Object.entries(values)) {
    const row = el('div', 'row'), track = el('div', 'track'), fill = el('div', 'fill' + (hotAbove && v >= hotAbove ? ' hot' : ''));
    fill.style.width = pct(v); track.append(fill); row.append(el('span', '', k), track, el('span', 'num', pct(v))); box.append(row);
  }
}
function list(id, items, build, empty) {
  const ul = $(id); ul.replaceChildren();
  if (!items.length && empty) ul.append(el('li', 'sub', empty));
  for (const it of items) { const li = el('li'); li.append(...[].concat(build(it))); ul.append(li); }
}
function renderPanel(s) {
  const m = s.mind, w = s.world;
  document.title = m.name + "'s island";
  $('name').textContent = m.name;
  $('clock').textContent = `${hhmm(w.minute)} · ${w.weather}${w.is_night ? ' · night' : ''}`;
  const doing = m.asleep ? 'asleep' : m.pondering.some(k => k !== 'goal' && k !== 'reflect') ? 'thinking it over' : m.action ? (m.action.step.capability || m.action.step.action).replace('_', ' ') : 'idle';
  $('status').textContent = `${m.mood} · ${doing}${m.action && m.action.progress ? ' ' + pct(m.action.progress) : ''} · island explored ${pct(m.explored)} · model: ${m.model}${m.model_available ? '' : ' (not answering: rules only)'}`;
  $('thought').textContent = m.thought ? '“' + m.thought + '”' : '';
  $('intention').textContent = m.intention ? `Intention: ${m.intention.label} — ${m.intention.why}${m.intention.for_goal ? ', and it serves the goal' : ''} [${m.intention.source}]` : 'No intention at the moment.';
  bars('emotions', m.emotions); bars('needs', m.needs, 0.85);
  const long = m.goals.filter(g => g.level === 3), short = m.goals.filter(g => g.level === 2).slice(-7);
  list('goals', [...long, ...short], g => {
    const c = g.conditions, extra = c.type === 'repeat' ? ` (${c.done || 0}/${c.count})` : '';
    return [el('span', g.level === 2 ? 'indent' : '', (g.level === 3 ? 'Long term: ' : '') + g.description + extra), tag(g.status, g.status === 'completed' ? 'done' : ''), g.source === 'model' ? tag('model') : ''];
  });
  list('monologue', [...m.monologue].reverse(), e => [el('span', 't', hhmm(e.minute).split(', ')[1]), el('span', '', e.text), e.source === 'model' ? tag('model') : tag(e.kind)]);
  list('decisions', [...m.decisions].reverse(), d => [el('span', 't', hhmm(d.minute).split(', ')[1]), el('span', '', d.choice), tag(d.source), el('div', 'sub indent', d.why + (d.alternatives.length ? ' · instead of: ' + d.alternatives.map(a => `${a[0]} (${a[1]})`).join(', ') : ''))]);
  list('retrieved', m.retrieved, r => [el('span', '', r.summary), el('div', 'mono indent', `score ${r.score} · ` + Object.entries(r.parts).map(([k, v]) => k + ' ' + v).join(' '))], 'The model has not been asked yet.');
  list('known', m.known, k => [el('span', '', k.look), tag(k.gone ? 'gone' : k.state.toLowerCase(), ['UNDERSTOOD', 'REMEMBERED'].includes(k.state) ? 'done' : ''),
    el('div', 'sub indent', k.caps.map(c => c + (k.effects[c] ? ' → ' + (Object.entries(k.effects[c]).map(([ch, v]) => `${ch} ${v > 0 ? '+' : ''}${v}`).join(', ') || 'nothing') : ' (untried)')).join(' · ') || 'not looked at closely yet')]);
  bars('traits', m.traits);
  list('prefs', Object.entries(m.preferences), ([k, v]) => [el('span', '', k.replace(':', ' ')), el('span', 'num', ' ' + (v > 0 ? '+' : '') + v)], 'Nothing learned yet.');
  $('metrics').textContent = Object.entries(m.metrics).map(([k, v]) => `${k}: ${v}`).join('\n'); $('metrics').style.whiteSpace = 'pre';
  $('messages').replaceChildren(...s.messages.slice().reverse().map(x => el('div', '', `${x.type} ${JSON.stringify(x.payload).slice(0, 150)}`)));
  document.querySelectorAll('[data-speed]').forEach(b => b.classList.toggle('on', +b.dataset.speed === s.speed));
  $('pause').classList.toggle('on', s.paused); $('pause').textContent = s.paused ? 'Resume' : 'Pause';
  if (m.thought !== lastThought) { lastThought = m.thought; thoughtAt = Date.now(); }
  const b = $('bubble'); b.hidden = !m.asleep && (!m.thought || Date.now() - thoughtAt > 15000); b.textContent = m.asleep ? 'z z z' : m.thought; b.classList.toggle('model', m.monologue.length && m.monologue[m.monologue.length - 1].source === 'model');
}

// ---------------------------------------------------------------- frame loop
const clock = new THREE.Clock(), v = new THREE.Vector3();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  const moving = honk.position.distanceTo(target) > 0.03;
  honk.position.lerp(target, 1 - Math.exp(-dt * 6));
  let d = heading - honk.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); honk.rotation.y += d * (1 - Math.exp(-dt * 8));
  const asleep = snap && snap.mind.asleep, act = snap && snap.world.creature.action;
  body.position.y = asleep ? 0.42 : 0.62 + (moving ? Math.abs(Math.sin(t * 11)) * 0.07 : Math.sin(t * 2) * 0.012);
  upper.rotation.x += ((asleep ? 1.25 : act === 'eat' || act === 'drink' || act === 'inspect' ? 0.5 + Math.sin(t * 6) * 0.25 : 0) - upper.rotation.x) * 0.1;
  upper.position.y = asleep ? -0.25 : 0;
  eyeL.visible = eyeR.visible = !asleep;
  footL.position.z = 0.05 + (moving ? Math.sin(t * 11) * 0.14 : 0); footR.position.z = 0.05 - (moving ? Math.sin(t * 11) * 0.14 : 0);
  honk.position.y = act === 'play' || act === 'splash' ? Math.abs(Math.sin(t * 7)) * 0.3 : 0;
  flash = Math.max(0, flash - dt); honk.scale.setScalar(1 + flash * 0.25);
  for (const g of things.values()) { if (g.userData.goal) g.position.lerp(g.userData.goal, 0.12); if (g.userData.spin) { g.userData.spin.rotation.y = t; g.userData.spin.position.y = 0.55 + Math.sin(t * 2 + g.position.x) * 0.08; } }
  if (snap) {       // light follows the simulated time of day
    const h = (snap.world.minute % 1440) / 60, day = Math.max(0, Math.sin((h - 6) / 15 * Math.PI)), wet = snap.world.weather === 'clear' ? 1 : snap.world.weather === 'rain' ? 0.6 : 0.4;
    sun.intensity = 0.15 + 2.2 * day * wet; hemi.intensity = 0.25 + 0.85 * day * wet;
    sun.position.set(Math.cos((h - 6) / 15 * Math.PI) * 30, 6 + day * 28, 12);
    scene.background = new THREE.Color().lerpColors(new THREE.Color(0x0d1424), new THREE.Color(wet < 1 ? 0x8fa3b3 : 0xa9d6f5), Math.min(1, day * 1.4));
  }
  if (rain.visible) { for (let i = 0; i < RAIN; i++) { rainPos[i * 3 + 1] -= dt * 26; if (rainPos[i * 3 + 1] < 0) rainPos[i * 3 + 1] = 30; } rainGeo.attributes.position.needsUpdate = true; }
  controls.update(); renderer.render(scene, camera);
  v.copy(honk.position).setY(2.3).project(camera);
  const b = $('bubble'); b.style.left = ((v.x + 1) / 2 * stage.clientWidth) + 'px'; b.style.top = ((1 - v.y) / 2 * stage.clientHeight) + 'px';
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
