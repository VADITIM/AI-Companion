<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honk Look Demo</title>
<style>
  :root {
    --cream: #fff4d6; --ink: #1a1040; --violet: #4b47d6; --shadow: rgba(26,16,64,.35);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1040; font-family: ui-rounded, "Nunito", system-ui, sans-serif; color: var(--ink); }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .pill { background: var(--cream); border-radius: 999px; box-shadow: 0 4px 0 var(--shadow); }
  #drives { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; padding: 10px 18px; border-radius: 18px; background: var(--cream); box-shadow: 0 4px 0 var(--shadow); max-width: calc(100vw - 32px); box-sizing: border-box; overflow-x: auto; }
  .drive { min-width: 64px; font-size: 12px; font-weight: 700; }
  .drive b { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  .bar { height: 6px; border-radius: 6px; background: rgba(26,16,64,.12); margin-top: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 6px; }
  #status { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 8px 18px 8px 8px; font-size: 14px; white-space: nowrap; max-width: calc(100vw - 32px); box-sizing: border-box; overflow: hidden; text-overflow: ellipsis; }
  #status .dot { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #c9c2ff, #4b47d6); border: 3px solid var(--cream); box-shadow: 0 0 0 2px #8a86f0; flex: none; }
  #bubble { position: fixed; pointer-events: none; transform: translate(-50%, -100%); font-size: 26px; padding: 10px 14px; border-radius: 26px; background: var(--cream); box-shadow: 0 4px 0 var(--shadow); }
  #bubble::after { content: ""; position: absolute; left: 30%; bottom: -12px; width: 12px; height: 12px; border-radius: 50%; background: var(--cream); }
  #panel { position: fixed; right: 16px; bottom: 70px; width: 240px; max-width: calc(100vw - 32px); background: var(--cream); border-radius: 16px; box-shadow: 0 4px 0 var(--shadow); font-size: 13px; }
  #panel summary { cursor: pointer; padding: 10px 14px; font-weight: 800; list-style: none; }
  #panel summary::-webkit-details-marker { display: none; }
  #panel .body { padding: 0 14px 12px; display: grid; gap: 8px; }
  #panel label { display: grid; gap: 3px; font-weight: 700; }
  #panel label.row { grid-template-columns: auto 1fr; align-items: center; gap: 8px; }
  #panel input[type=range], #panel select { width: 100%; accent-color: #4b47d6; }
  #panel span.v { font-weight: 400; opacity: .7; }
</style>
</head>
<body>
<div id="drives"></div>
<div id="bubble">🍩</div>
<div id="status" class="pill"><span class="dot"></span><span id="statusText">Honk is deciding what to do next</span></div>

<details id="panel">
  <summary>Look settings ▾</summary>
  <div class="body">
    <label>Pixel size <span class="v" id="vPix"></span><input id="pix" type="range" min="1" max="8" step="1" value="3"></label>
    <label>Dither spread <span class="v" id="vDit"></span><input id="dit" type="range" min="0" max="0.3" step="0.01" value="0.1"></label>
    <label>Saturation <span class="v" id="vSat"></span><input id="sat" type="range" min="0.5" max="2" step="0.05" value="1.3"></label>
    <label>Palette
      <select id="pal">
        <option value="vibrant">Vibrant 16</option>
        <option value="violet">Original violet</option>
        <option value="dusk">Dusk</option>
        <option value="none">No palette (raw)</option>
      </select>
    </label>
    <label class="row"><input id="out" type="checkbox" checked> Outlines</label>
    <label class="row"><input id="ht" type="checkbox" checked> Halftone foliage</label>
    <label class="row"><input id="rot" type="checkbox" checked> Auto-rotate camera</label>
  </div>
</details>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- palette (the only colours allowed on screen) ----------
const PAL = {
  navy: 0x1a1040, indigo: 0x2d2a8c, violet: 0x4b47d6, periwinkle: 0x8a86f0, lavender: 0xc9c2ff,
  cream: 0xfff4d6, white: 0xffffff, pink: 0xff8fd8, magenta: 0xe0369e, plum: 0x7a2a8f,
  teal: 0x1fb5a6, mint: 0x7ff0c6, yellow: 0xffd23f, orange: 0xff8a3d, red: 0xe8384f, lime: 0xb6f04a,
};
const PALETTES = {
  vibrant: Object.values(PAL),
  violet: [0x1a1040, 0x2d2a8c, 0x4b47d6, 0x8a86f0, 0xc9c2ff, 0xfff4d6, 0xff8fd8, 0x7a2a8f],
  dusk: [0x120c2c, 0x3b1f5c, 0x7a2a8f, 0xe0369e, 0xff8a3d, 0xffd23f, 0xfff4d6, 0x2d2a8c, 0x1fb5a6, 0xff8fd8, 0x4b47d6, 0xe8384f],
};
const hexToSrgb = h => new THREE.Vector3(((h >> 16) & 255) / 255, ((h >> 8) & 255) / 255, (h & 255) / 255);
function paletteUniform(name) {
  const list = PALETTES[name] || PALETTES.vibrant;
  return Array.from({ length: 16 }, (_, i) => hexToSrgb(list[i % list.length]));
}

// ---------- seeded random so generators are reproducible ----------
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- halftone material (per material, as in the spec) ----------
const HALFTONE = { value: 1 };
function halftone(mat) {
  mat.onBeforeCompile = s => {
    s.uniforms.uHalftone = HALFTONE;
    s.fragmentShader = 'uniform float uHalftone;\n' + s.fragmentShader.replace('#include <dithering_fragment>', `
      #include <dithering_fragment>
      if (uHalftone > 0.5) {
        float l = dot(gl_FragColor.rgb, vec3(.3, .59, .11));
        vec2 c = fract(gl_FragCoord.xy / 3.0) - 0.5;
        float on = step(length(c), clamp(1.0 - l * 1.6, 0.0, 1.0) * 0.72);
        gl_FragColor.rgb = mix(vec3(1.0, .275, .69), vec3(.196, .022, .274), on);
      }`);
  };
  return mat;
}

// ---------- recipe builder: JSON primitives -> meshes ----------
const GEO = {
  box: () => new THREE.BoxGeometry(1, 1, 1),
  sphere: () => new THREE.SphereGeometry(1, 20, 14),
  cylinder: () => new THREE.CylinderGeometry(1, 1, 1, 16),
  cone: () => new THREE.ConeGeometry(1, 1, 16),
  capsule: () => new THREE.CapsuleGeometry(1, 1, 6, 12),
  torus: () => new THREE.TorusGeometry(1, 0.42, 12, 28),
};
function build(recipe) {
  const g = new THREE.Group(); g.name = recipe.name;
  for (const p of recipe.parts) {
    const color = PAL[p.color] ?? PAL.violet;
    const mat = p.glow ? new THREE.MeshBasicMaterial({ color, map: p.map || null }) : new THREE.MeshLambertMaterial({ color, map: p.map || null });
    if (p.halftone) halftone(mat);
    const m = new THREE.Mesh(GEO[p.shape](), mat);
    m.position.fromArray(p.pos || [0, 0, 0]);
    m.rotation.set(...(p.rot || [0, 0, 0]).map(THREE.MathUtils.degToRad));
    m.scale.fromArray(p.scale || [1, 1, 1]);
    m.castShadow = !p.glow; m.receiveShadow = true;
    g.add(m);
  }
  return g;
}

// ---------- recipes Honk could have written ----------
const KIWI = { name: 'kiwi', parts: [
  { shape: 'sphere', pos: [0, 0.65, 0], scale: [0.5, 0.55, 0.42], color: 'violet' },
  { shape: 'sphere', pos: [0.32, 1.05, 0], scale: [0.26, 0.26, 0.24], color: 'violet' },
  { shape: 'cone', pos: [0.86, 0.98, 0], rot: [0, 0, -100], scale: [0.045, 0.6, 0.045], color: 'lavender' },
  { shape: 'sphere', pos: [0.47, 1.12, 0.16], scale: [0.05, 0.05, 0.05], color: 'white', glow: true },
  { shape: 'sphere', pos: [0.47, 1.12, -0.16], scale: [0.05, 0.05, 0.05], color: 'white', glow: true },
  { shape: 'cylinder', pos: [0.05, 0.16, 0.12], scale: [0.035, 0.32, 0.035], color: 'indigo' },
  { shape: 'cylinder', pos: [0.05, 0.16, -0.12], scale: [0.035, 0.32, 0.035], color: 'indigo' },
]};
const DONUT = { name: 'donut', parts: [
  { shape: 'torus', pos: [0, 0.13, 0], rot: [90, 0, 0], scale: [0.3, 0.3, 0.3], color: 'orange' },
  { shape: 'torus', pos: [0, 0.19, 0], rot: [90, 0, 0], scale: [0.3, 0.3, 0.18], color: 'pink' },
]};
const STOOL = { name: 'stool', parts: [
  { shape: 'cylinder', pos: [0, 0.75, 0], scale: [0.28, 0.08, 0.28], color: 'teal' },
  { shape: 'cylinder', pos: [0, 0.37, 0], scale: [0.05, 0.74, 0.05], color: 'navy' },
]};
const LAMP = { name: 'lamp', parts: [
  { shape: 'cylinder', pos: [0, 1.6, 0], scale: [0.06, 3.2, 0.06], color: 'navy' },
  { shape: 'sphere', pos: [0, 3.3, 0], scale: [0.22, 0.22, 0.22], color: 'yellow', glow: true },
]};

// ---------- generators: a few parameters -> a recipe ----------
function signTexture(text, fg = '#ff8a3d', bg = '#1a1040') {
  const c = document.createElement('canvas'); c.width = 512; c.height = 96;
  const x = c.getContext('2d'); x.fillStyle = bg; x.fillRect(0, 0, 512, 96);
  x.fillStyle = fg; x.font = 'bold 64px system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text, 256, 52);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function building({ floors = 2, width = 6, depth = 4, color = 'indigo', sign = null, seed = 1 }) {
  const r = rng(seed), h = floors * 2.2, parts = [
    { shape: 'box', pos: [0, h / 2, 0], scale: [width, h, depth], color },
    { shape: 'box', pos: [0, h + 0.12, 0], scale: [width + 0.3, 0.24, depth + 0.3], color: 'navy' },
    { shape: 'box', pos: [0, 0.9, depth / 2 + 0.01], scale: [1.1, 1.8, 0.06], color: 'navy' },
  ];
  const cols = Math.max(1, Math.floor(width / 1.4));
  for (let f = sign ? 1 : 0; f < floors; f++) for (let i = 0; i < cols; i++) {
    const x = -width / 2 + (i + 0.5) * (width / cols);
    if (!sign && f === 0 && Math.abs(x) < 0.9) continue;
    parts.push({ shape: 'box', pos: [x, f * 2.2 + 1.2, depth / 2 + 0.02], scale: [0.7, 0.9, 0.05],
      color: r() > 0.45 ? 'yellow' : 'lavender', glow: r() > 0.3 });
  }
  if (sign) parts.push({ shape: 'box', pos: [0, 2.2, depth / 2 + 0.06], scale: [width * 0.95, 1.1, 0.06], color: 'white', map: signTexture(sign), glow: true });
  return { name: 'building', parts };
}
function tree({ blobs = 7, height = 3, seed = 1 }) {
  const r = rng(seed), parts = [{ shape: 'cylinder', pos: [0, height / 2, 0], scale: [0.16, height, 0.16], color: 'plum' }];
  for (let i = 0; i < blobs; i++) {
    const a = r() * Math.PI * 2, d = r() * 0.9, s = 0.6 + r() * 0.6;
    parts.push({ shape: 'sphere', pos: [Math.cos(a) * d, height + r() * 1.2, Math.sin(a) * d], scale: [s, s * 0.85, s], color: 'pink', halftone: true });
  }
  return { name: 'tree', parts };
}
function stall() {
  return { name: 'stall', parts: [
    { shape: 'box', pos: [0, 0.55, 0], scale: [3.2, 1.1, 1.1], color: 'violet' },
    { shape: 'box', pos: [0, 2.3, -0.1], rot: [-12, 0, 0], scale: [3.6, 0.12, 1.8], color: 'magenta' },
    { shape: 'cylinder', pos: [-1.6, 1.2, -0.45], scale: [0.05, 2.4, 0.05], color: 'navy' },
    { shape: 'cylinder', pos: [1.6, 1.2, -0.45], scale: [0.05, 2.4, 0.05], color: 'navy' },
    { shape: 'box', pos: [0.9, 1.25, 0], scale: [0.25, 0.3, 0.25], color: 'red', glow: true },
    { shape: 'box', pos: [-0.6, 1.2, 0], scale: [0.5, 0.2, 0.3], color: 'lime', glow: true },
  ]};
}
function track(length = 70) {
  const parts = [
    { shape: 'box', pos: [0, 0.08, 0.6], scale: [length, 0.08, 0.1], color: 'lavender' },
    { shape: 'box', pos: [0, 0.08, -0.6], scale: [length, 0.08, 0.1], color: 'lavender' },
  ];
  for (let x = -length / 2; x <= length / 2; x += 1.2) parts.push({ shape: 'box', pos: [x, 0.03, 0], scale: [0.3, 0.06, 1.7], color: 'navy' });
  return { name: 'track', parts };
}
function train(cars = 2) {
  const parts = [];
  for (let c = 0; c < cars; c++) {
    const x = c * 4.4;
    parts.push({ shape: 'box', pos: [x, 1.3, 0], scale: [4, 1.9, 1.8], color: c ? 'teal' : 'red' });
    parts.push({ shape: 'box', pos: [x, 2.35, 0], scale: [4.1, 0.2, 1.9], color: 'navy' });
    for (let w = -1.3; w <= 1.3; w += 1.3) {
      parts.push({ shape: 'box', pos: [x + w, 1.6, 0.92], scale: [0.8, 0.6, 0.04], color: 'cream', glow: true });
      parts.push({ shape: 'box', pos: [x + w, 1.6, -0.92], scale: [0.8, 0.6, 0.04], color: 'cream', glow: true });
    }
    for (const wx of [-1.3, 1.3]) for (const wz of [0.75, -0.75])
      parts.push({ shape: 'cylinder', pos: [x + wx, 0.35, wz], rot: [90, 0, 0], scale: [0.3, 0.12, 0.3], color: 'navy' });
  }
  return { name: 'train', parts };
}

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(PAL.lavender, 35, 140);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(14, 7, 16);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0); controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.4;
controls.maxPolarAngle = Math.PI * 0.48; controls.minDistance = 5; controls.maxDistance = 60;

// sky: gradient sphere (halftone-friendly bands come from the dither)
scene.add(new THREE.Mesh(new THREE.SphereGeometry(400, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, fog: false,
  vertexShader: 'varying float h; void main(){ h = normalize(position).y; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: 'varying float h; void main(){ vec3 top = vec3(.25,.24,.86), mid = vec3(.58,.51,1.), hor = vec3(1.,.9,.67); vec3 c = h < .15 ? mix(hor, mid, smoothstep(0.,.15,h)) : mix(mid, top, smoothstep(.15,.6,h)); gl_FragColor = vec4(c,1.); }',
})));

scene.add(new THREE.HemisphereLight(PAL.pink, PAL.indigo, 1.4));
const sun = new THREE.DirectionalLight(PAL.cream, 2.2);
sun.position.set(-12, 20, 10); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 80 });
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshLambertMaterial({ color: PAL.periwinkle }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(300, 100, PAL.white, PAL.white); grid.position.y = 0.01; scene.add(grid);

function place(recipe, x, z, ry = 0) { const o = build(recipe); o.position.set(x, 0, z); o.rotation.y = ry; scene.add(o); return o; }

place(building({ floors: 2, width: 8, color: 'violet', sign: 'INTERNET CAFE', seed: 3 }), 0, -5);
place(building({ floors: 5, width: 6, color: 'plum', seed: 7 }), -11, -14);
place(building({ floors: 7, width: 7, color: 'violet', seed: 11 }), 9, -18);
place(building({ floors: 4, width: 9, color: 'teal', seed: 5 }), -1, -24);
place(building({ floors: 3, width: 5, color: 'magenta', seed: 9 }), 16, -8, -0.6);
place(stall(), -7, 1, 0.4);
[[-8.2, 2.3], [-7, 2.6], [-5.8, 2.3]].forEach(([x, z]) => place(STOOL, x, z));
[[-13, -4, 2], [10, -2, 4], [13, 5, 6], [-11, 9, 8], [5, 11, 10]].forEach(([x, z, s]) => place(tree({ blobs: 7, height: 3 + (s % 3) * 0.6, seed: s }), x, z));
[[5, 3], [-3, 6], [-14, 3]].forEach(([x, z]) => place(LAMP, x, z));
const donut = place(DONUT, 2.5, 3.5);
place(track(), 0, -10);
const tr = place(train(3), -30, -10);
const kiwi = place(KIWI, 0, 0);
kiwi.scale.setScalar(1.6);
window.pino = { camera, controls, kiwi }; // for debugging in the console

// ---------- low-res target + post pass (dither, palette, outlines) ----------
let rt;
const post = new THREE.ShaderMaterial({
  uniforms: {
    tColor: { value: null }, tDepth: { value: null }, lowRes: { value: new THREE.Vector2() },
    palette: { value: paletteUniform('vibrant') }, usePalette: { value: 1 },
    spread: { value: 0.1 }, sat: { value: 1.3 }, outline: { value: 1 },
    near: { value: camera.near }, far: { value: camera.far },
  },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `
    uniform sampler2D tColor, tDepth; uniform vec2 lowRes; uniform vec3 palette[16];
    uniform float usePalette, spread, sat, outline, near, far;
    varying vec2 vUv;
    float bayer2(vec2 a){ a = floor(a); return fract(a.x / 2. + a.y * a.y * .75); }
    float bayer4(vec2 a){ return bayer2(.5 * a) * .25 + bayer2(a); }
    float lin(float d){ float z = d * 2. - 1.; return 2. * near * far / (far + near - z * (far - near)); }
    float depthAt(vec2 px){ return lin(texture2D(tDepth, (px + .5) / lowRes).x); }
    vec3 nearest(vec3 c){
      vec3 best = palette[0]; float bd = 1e9;
      for (int i = 0; i < 16; i++) {
        vec3 e = (c - palette[i]) * vec3(.30, .59, .11);
        float k = dot(e, e);
        if (k < bd) { bd = k; best = palette[i]; }
      }
      return best;
    }
    void main(){
      vec2 px = floor(vUv * lowRes);
      vec3 c = pow(max(texture2D(tColor, (px + .5) / lowRes).rgb, 0.), vec3(1. / 2.2));
      float l = dot(c, vec3(.299, .587, .114));
      c = clamp(mix(vec3(l), c, sat), 0., 1.);
      vec3 col = c;
      if (usePalette > .5) col = nearest(clamp(c + (bayer4(px) - .5) * spread, 0., 1.));
      if (outline > .5) {
        float d = depthAt(px);
        float n = max(max(depthAt(px + vec2(1., 0.)), depthAt(px - vec2(1., 0.))),
                      max(depthAt(px + vec2(0., 1.)), depthAt(px - vec2(0., 1.))));
        if (n - d > d * .15) col = usePalette > .5 ? palette[0] : vec3(.1, .06, .25);
      }
      gl_FragColor = vec4(col, 1.);
    }`,
  depthTest: false, depthWrite: false,
});
const postScene = new THREE.Scene();
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post));
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

let pixelSize = 3;
function makeTarget() {
  rt?.dispose(); rt?.depthTexture?.dispose();
  const w = Math.max(1, Math.floor(innerWidth / pixelSize)), h = Math.max(1, Math.floor(innerHeight / pixelSize));
  rt = new THREE.WebGLRenderTarget(w, h, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
  rt.depthTexture = new THREE.DepthTexture(w, h);
  post.uniforms.tColor.value = rt.texture; post.uniforms.tDepth.value = rt.depthTexture;
  post.uniforms.lowRes.value.set(w, h);
}
makeTarget();
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  makeTarget();
});

// ---------- UI: drives, status, thought bubble, settings ----------
const DRIVES = [['Fullness', '#b6f04a'], ['Energy', '#ff8a3d'], ['Wonder', '#e0369e'], ['Joy', '#ffd23f'], ['Calm', '#1fb5a6']];
const drivesEl = document.getElementById('drives');
drivesEl.innerHTML = DRIVES.map(([n, c], i) => `<div class="drive"><b style="background:${c}"></b>${n}<div class="bar"><i id="d${i}" style="background:${c}"></i></div></div>`).join('');
const STATUS = ['Honk is deciding what to do next', 'Honk is watching the trains', 'Honk wants that donut', 'Honk is thinking about drawing a cat', 'Honk hums a tune he made up'];
const THOUGHTS = ['🍩', '🚂', '🐱', '🎹', '🖍️'];
const statusText = document.getElementById('statusText'), bubble = document.getElementById('bubble');
let mood = 0;
setInterval(() => { mood = (mood + 1) % STATUS.length; statusText.textContent = STATUS[mood]; bubble.textContent = THOUGHTS[mood]; }, 4000);

const $ = id => document.getElementById(id);
function syncLabels() { $('vPix').textContent = pixelSize; $('vDit').textContent = (+$('dit').value).toFixed(2); $('vSat').textContent = (+$('sat').value).toFixed(2); }
$('pix').oninput = e => { pixelSize = +e.target.value; makeTarget(); syncLabels(); };
$('dit').oninput = e => { post.uniforms.spread.value = +e.target.value; syncLabels(); };
$('sat').oninput = e => { post.uniforms.sat.value = +e.target.value; syncLabels(); };
$('pal').onchange = e => { const v = e.target.value; post.uniforms.usePalette.value = v === 'none' ? 0 : 1; if (v !== 'none') post.uniforms.palette.value = paletteUniform(v); };
$('out').onchange = e => { post.uniforms.outline.value = e.target.checked ? 1 : 0; };
$('ht').onchange = e => { HALFTONE.value = e.target.checked ? 1 : 0; };
$('rot').onchange = e => { controls.autoRotate = e.target.checked; };
syncLabels();

// ---------- loop ----------
const clock = new THREE.Clock(), head = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  // kiwi wanders in a loop and bobs
  const a = t * 0.35, x = Math.cos(a) * 4, z = Math.sin(a) * 3 + 1;
  kiwi.position.set(x, Math.abs(Math.sin(t * 6)) * 0.06, z);
  kiwi.rotation.y = Math.atan2(-(Math.cos(a) * 3), -Math.sin(a) * 4);
  donut.rotation.y = t * 0.8;
  tr.position.x = ((t * 6) % 90) - 45;
  DRIVES.forEach((_, i) => { $('d' + i).style.width = (55 + 35 * Math.sin(t * 0.2 + i * 1.7)) + '%'; });

  controls.update();
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);

  head.copy(kiwi.position).add(new THREE.Vector3(0, 2, 0)).project(camera);
  bubble.style.display = head.z < 1 ? 'block' : 'none';
  bubble.style.left = ((head.x + 1) / 2 * innerWidth + 40) + 'px';
  bubble.style.top = ((1 - head.y) / 2 * innerHeight) + 'px';
});
</script>
</body>
</html>
